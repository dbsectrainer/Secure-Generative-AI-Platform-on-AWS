name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests, typecheck, coverage, and audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked development dependencies
        run: pip install -r requirements-dev.lock
      - name: Lint
        run: ruff check .
      - name: Static type check
        run: mypy
      - name: Unit, regression, and Moto integration tests
        run: python -m pytest -q
      - name: Coverage
        run: |
          python -m pytest --cov --cov-report=term-missing \
            --cov-report=xml:coverage.xml -q
      - name: Dependency audit
        run: pip-audit -r requirements-dev.lock
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements-dev.lock --of json -o sbom.cdx.json --validate

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
      - name: Validate prod
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
      - name: Mock-provider full-stack wiring tests (dev)
        working-directory: terraform/environments/dev
        run: terraform test -no-color
      - name: Mock-provider full-stack wiring tests (prod)
        working-directory: terraform/environments/prod
        run: terraform test -no-color
      - name: RAG layer/trigger/guardrail module test
        working-directory: terraform/modules/rag
        run: |
          terraform init -backend=false -input=false -no-color
          terraform test -no-color
      - name: Cognito auth module test
        working-directory: terraform/modules/auth
        run: |
          terraform init -backend=false -input=false -no-color
          terraform test -no-color

  sam:
    name: SAM template, build, and cfn-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install SAM CLI and cfn-lint
        run: pip install "aws-sam-cli>=1.100,<2" "cfn-lint>=1.0"
      - name: Lint SAM template
        run: sam validate --lint
      - name: Lint CloudFormation
        run: cfn-lint template.yaml
      - name: Prepare layer layout
        run: make layer-prepare
      - name: Build all functions and layer
        # Use the local Python toolchain rather than an arm64 build container on
        # the x86_64 runner; this job validates packaging, not deployment.
        run: sam build --no-use-container


  localstack:
    name: LocalStack Terraform infrastructure test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: s3,iam,kms,sts,logs,lambda,ec2
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install boto3
        run: pip install boto3
      - name: Run LocalStack S3/IAM/KMS infrastructure test
        run: scripts/run_localstack_infra_test.sh
