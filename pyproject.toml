[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "genai/tests",
    "tests/layers_common",
    "lambda/bedrock_integration/tests",
    "rag/ingestion/tests",
    "rag/embedding/tests",
    "rag/retrieval/tests",
    "rag/orchestrator/tests",
]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
extend-exclude = [
    ".aws-sam",
    ".terraform",
    "layers/prompt_builder/builder.py",
    "layers/prompt_builder/templates.py",
]

[tool.ruff.lint]
# Keep the gate stable across Ruff releases and cover the defects this project
# cares about: pycodestyle errors, pyflakes, and undefined names.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["genai", "lambda", "layers/common", "rag"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
files = ["genai", "lambda", "layers/common", "rag"]
exclude = ["/tests/", "/__pycache__/"]
ignore_missing_imports = true
warn_unused_ignores = false
